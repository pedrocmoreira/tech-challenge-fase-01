services:
  db:
    image: postgres:16-alpine
    container_name: garage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garagesystem_db
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    container_name: garage-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  #WEB UI -> http://localhost:8025
    logging:
      driver: none

  app:
    build: .
    container_name: garage-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garagesystem_db
      DB_USER: garage
      DB_PASS: garage123
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: noreply@garagesystem.com
      APP_BASE_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  pgdata: