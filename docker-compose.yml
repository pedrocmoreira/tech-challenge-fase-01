services:
  db:
    image: postgres:16-alpine
    container_name: garage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garagesystem_db
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: garage-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garagesystem_db
      DB_USER: garage
      DB_PASS: garage123
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: