name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar build + testes automatizados
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  deploy:
    name: Build da imagem + Deploy no Kubernetes
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t garage-system:${{ github.sha }} .

      - name: Instalar kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Provisionar cluster + banco (Terraform)
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -target=kind_cluster.this
          terraform apply -auto-approve

      - name: Carregar imagem no cluster kind
        run: kind load docker-image garage-system:${{ github.sha }} --name garage-system

      - name: Aplicar manifestos Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/garage-system garage-system=garage-system:${{ github.sha }}

      - name: Aguardar rollout da aplicação
        run: kubectl rollout status deployment/garage-system --timeout=180s

      - name: Verificar saúde da aplicação
        run: |
          kubectl get pods -o wide
          kubectl port-forward svc/garage-system 8080:8080 &
          sleep 5
          curl --fail http://localhost:8080/actuator/health

      - name: Destruir ambiente efêmero
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve