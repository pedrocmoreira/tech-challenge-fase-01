apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-system
  labels:
    app: garage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: garage-system
  template:
    metadata:
      labels:
        app: garage-system
    spec:
      containers:
        - name: garage-system
          image: garage-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: garage-system-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: garage-system-secret
                  key: DB_PASS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-system-secret
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: garage-system-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garage-system-secret
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15